version: "3.8"

services:
  crudapi:
    image: ghcr.io/websvcin/crudapi:latest
    container_name: crudapi
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      # Persistent storage — DO NOT REMOVE either mount
      # ./data       → admin DB, audit logs, sessions, sqlite files, hangfire, rate-limit store
      # ./bulk-files → files uploaded through the bulk-import feature
      - ./data:/app/Data
      - ./bulk-files:/app/bulk-files
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production

      # The rate-limiting admin's own store defaults outside /app/Data — point it at a
      # subfolder of the mounted data volume or its config/quotas reset on every redeploy.
      - RateLimitAdmin__DataDirectory=/app/Data/RateLimitAdmin

      # Branding (override in .env)
      - Docs__ProductName=${PRODUCT_NAME:-CrudApi}
      - Docs__GithubUrl=${GITHUB_URL:-https://github.com/websvcin/crudapi}
      - Docs__SupportEmail=${SUPPORT_EMAIL:-}

      # Secrets (recommended via .env file, not here)
      # - AI__ApiKey=${AI_API_KEY}
      # - GitHub__Token=${GITHUB_TOKEN}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
